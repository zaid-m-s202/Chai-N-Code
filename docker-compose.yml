services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: cadastral
      POSTGRES_USER: cadastral
      POSTGRES_PASSWORD: cadastral_dev_only
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadastral -d cadastral"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./src/backend
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes: ["./src/backend:/app"]
    working_dir: /app
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://cadastral:cadastral_dev_only@db:5432/cadastral
      REDIS_URL: redis://redis:6379/0
      WORKING_CRS: EPSG:4326
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./src/frontend
    ports: ["3000:80", "5173:80"]
    depends_on:
      - backend
