services:
  - type: web
    name: cadastral-backend
    runtime: docker
    rootDir: src/backend
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: WORKING_CRS
        value: EPSG:4326
      - key: CORS_ORIGINS
        value: https://pune-3dulpin-cadastre.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
